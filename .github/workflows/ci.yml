name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Testes
        run: bun run test
      - name: Build
        run: bun run build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Banco local com todas as migrations
        run: supabase db start
      - name: Testes do banco (pgTAP)
        run: supabase test db
      - name: Backup e restauração (ida e volta)
        run: bash scripts/test-backup-roundtrip.sh
